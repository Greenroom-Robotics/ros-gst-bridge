[workspace]
name = "gst_pipeline"
channels = [
  "http://localhost:12222/general",
  "https://prefix.dev/robostack-kilted",
  "https://prefix.dev/conda-forge",
]
platforms = ["linux-64", "linux-aarch64"]
preview = ["pixi-build"]

[dependencies]
gst_pipeline = { path = "." }

[package]
name        = "gst_pipeline"
version     = "0.1.0"
description = "Run GStreamer pipelines in ROS"
license     = "LGPL-3.0-or-later"
authors     = ["Greenroom Robotics <software-team@greenroomrobotics.com>"]

[package.build.backend]
name    = "pixi-build-ros-gr"
version = ">=0.4,<0.5"

[package.build.config]
mode         = "pixi-native"
build-type   = "ament_python"
distro       = "kilted"
build-number = 1

[package.host-dependencies]
python    = "*"
hatchling = "*"

[package.run-dependencies]
python                        = "*"
ros-kilted-rclpy              = "*"
ros-kilted-std-msgs           = "*"
ros-kilted-diagnostic-updater = "*"
ros-kilted-diagnostic-msgs    = "*"
gst-python                    = "*"
gstreamer                     = "*"
gst-plugins-base              = "*"
gst-plugins-good              = "*"
# Sibling — pinned to its own release version.
gst_bridge = "==0.1.0"

# Test env builds the package from source with colcon (deb parity),
# so it needs the build (host) deps as well as the test deps.
[feature.tests.dependencies]
python                        = "*"
hatchling                     = "*"
ros-kilted-rclpy              = "*"
ros-kilted-std-msgs           = "*"
ros-kilted-diagnostic-updater = "*"
ros-kilted-diagnostic-msgs    = "*"
gst-python                    = "*"
gstreamer                     = "*"
gst-plugins-base              = "*"
gst-plugins-good              = "*"
gst_bridge                    = "==0.1.0"
ros-kilted-ament-copyright    = "*"
ros-kilted-ament-flake8       = "*"
ros-kilted-ament-pep257       = "*"
pytest                        = "*"
colcon-common-extensions      = "*"

[feature.tests.tasks]
test = "colcon build && (LD_PRELOAD=$CONDA_PREFIX/lib/libpython3.so colcon test --event-handlers console_direct+ || true) && colcon test-result --all --verbose"

[environments]
tests = { features = ["tests"], no-default-feature = true }
