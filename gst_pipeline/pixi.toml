[workspace]
name = "gst_pipeline"
channels = [
  "az://stgrcondachannel.blob.core.windows.net/general",
  "https://prefix.dev/robostack-kilted",
  "https://prefix.dev/conda-forge",
]
platforms = ["linux-64", "linux-aarch64"]
preview = ["pixi-build"]

[dependencies]
# No ros-kilted-desktop here: the colcon build and tests get their tooling from
# the `test` extra's ros-dev-tools-meta, and desktop pulls turtlesim -> qt-main,
# which only accepts the gst-plugins-base 1.26 series. That dragged the whole env
# back to 1.26 while gst_bridge builds against 1.28, so the two could not be
# resolved together.
gst_pipeline = { path = ".", extras = ["test"] }

[package]
name = "gst_pipeline"
version = "0.1.1"
description = "Run GStreamer pipelines in ROS"
license = "LGPL-3.0-or-later"
authors = ["Greenroom Robotics <software-team@greenroomrobotics.com>"]

[package.build.backend]
name = "pixi-build-ros-gr"
version = ">=0.5,<0.6"

[package.build.config]
mode = "pixi-native"
build-type = "ament_python"
distro = "kilted"
build-number = 1

[package.host-dependencies]
python = "*"
hatchling = "*"

[package.run-dependencies]
python = "*"
ros-kilted-rclpy = "*"
ros-kilted-std-msgs = "*"
ros-kilted-diagnostic-updater = "*"
ros-kilted-diagnostic-msgs = "*"
gst-python = "*"
# Capped below 1.28.5 to stay installable with the rest of the GR closure,
# which caps there too (gst-plugins-ugly tops out at 1.28.4). The generated
# run-export follows whatever resolves here, so an uncapped 1.28.5 build would
# export >=1.28.5 and become uninstallable alongside greenstream.
gstreamer = "<1.28.5"
gst-plugins-base = "<1.28.5"
gst-plugins-good = "*"
# Sibling in this repo — path dep, so a version bump needs no pin chasing
# and the buildfarm never has to order the two builds.
gst_bridge = { path = "../gst_bridge" }

# Build-only tools the run-closure (pulled in via the path dependency on this
# package) doesn't provide. Everything else — ament-cmake, the rosidl stack,
# the message packages — comes transitively, so it isn't re-listed here.
[package.extra-dependencies.test]
ros-dev-tools-meta = "*"
ros-kilted-ament-copyright = "*"
ros-kilted-ament-flake8 = "*"
ros-kilted-ament-pep257 = "*"
pytest = "*"

[tasks]
build = "colcon build"

# `test` runs build -> colcon-test -> test-result as a dependency chain. A
# failing step stops the chain and fails the task, so a build break or a test
# failure both surface — no exit codes to juggle.
[tasks.colcon-test]
cmd = "bash -c 'colcon test --event-handlers console_direct+ || [ $? -eq 5 ]'"
depends-on = ["build"]

[tasks.test]
cmd = "colcon test-result --all --verbose"
depends-on = ["colcon-test"]
