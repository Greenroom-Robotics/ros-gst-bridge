[workspace]
name = "gst_bridge"
channels = [
  "az://stgrcondachannel.blob.core.windows.net/general",
  "https://prefix.dev/robostack-kilted",
  "https://prefix.dev/conda-forge",
]
platforms = ["linux-64", "linux-aarch64"]
preview = ["pixi-build"]

[dependencies]
gst_bridge = { path = ".", extras = ["test"] }

[package]
name = "gst_bridge"
version = "0.1.1"
description = "Run ROS nodes in a gstreamer pipeline"
license = "LGPL-3.0-or-later"
authors = ["Greenroom Robotics <software-team@greenroomrobotics.com>"]

[package.build.backend]
name = "pixi-build-ros-gr"
version = ">=0.5,<0.6"

[package.build.config]
mode = "pixi-native"
build-type = "ament_cmake"
distro = "kilted"
build-number = 3

[package.host-dependencies]
ros-kilted-ament-cmake = "*"
ros-kilted-rclcpp = "*"
ros-kilted-std-msgs = "*"
ros-kilted-sensor-msgs = "*"
ros-kilted-builtin-interfaces = "*"
pkg-config = "*"
# gst-plugins-ugly (x264enc) tops out at 1.28.4, and the run-export follows
# whatever resolves here
gstreamer = "<1.28.5"
gst-plugins-base = "<1.28.5"
glib = "*"
lttng-ust = "*"
zlib = "*"
audio_msgs = { path = "../audio_msgs" }

[package.run-dependencies]
ros-kilted-rclcpp = "*"
ros-kilted-std-msgs = "*"
ros-kilted-sensor-msgs = "*"
gstreamer = "<1.28.5"
gst-plugins-base = "<1.28.5"
gst-plugins-good = "*"
glib = "*"
lttng-ust = "*"
audio_msgs = { path = "../audio_msgs" }

[package.extra-dependencies.test]
ros-dev-tools-meta = "*"
ros-kilted-rosidl-default-generators = "*"
ros-kilted-ament-lint-auto = "*"
# gstreamer-audio-1.0.pc needs zlib.pc for its Requires.private
zlib = "*"

[tasks]
build = "colcon build"

# exit 5 = no tests found
[tasks.colcon-test]
cmd = "bash -c 'colcon test --event-handlers console_direct+ || [ $? -eq 5 ]'"
depends-on = ["build"]

[tasks.test]
cmd = "colcon test-result --all --verbose"
depends-on = ["colcon-test"]
