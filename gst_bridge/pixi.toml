[workspace]
name = "gst_bridge"
channels = [
  "http://localhost:8000",
  "https://prefix.dev/robostack-kilted",
  "https://prefix.dev/conda-forge",
]
platforms = ["linux-64", "linux-aarch64"]
preview = ["pixi-build"]

[dependencies]
gst_bridge = { path = "." }

[package]
name = "gst_bridge"
version = "0.1.0"
description = "Run ROS nodes in a gstreamer pipeline"
license = "LGPL-3.0-or-later"
authors = ["Greenroom Robotics <software-team@greenroomrobotics.com>"]

[package.build.backend]
name = "pixi-build-ros-gr"
version = "*"

[package.build.config]
mode = "pixi-native"
build-type = "ament_cmake"
distro = "kilted"
build-number = 2

[package.host-dependencies]
ros-kilted-ament-cmake     = "*"
ros-kilted-rclcpp          = "*"
ros-kilted-std-msgs        = "*"
ros-kilted-sensor-msgs     = "*"
ros-kilted-builtin-interfaces = "*"
pkg-config                 = "*"
gstreamer                  = "*"
gst-plugins-base           = "*"
glib                       = "*"
lttng-ust                  = "*"
zlib                       = "*"
# Sibling on this branch — pinned to its own release version.
audio_msgs                 = "==0.1.0"

[package.run-dependencies]
ros-kilted-rclcpp          = "*"
ros-kilted-std-msgs        = "*"
ros-kilted-sensor-msgs     = "*"
gstreamer                  = "*"
gst-plugins-base           = "*"
gst-plugins-good           = "*"
glib                       = "*"
lttng-ust                  = "*"
audio_msgs                 = "==0.1.0"
